<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="perspect-contract" content="1.0.0 ebbf67aa4d0c034fd347c4fa03bd7816176a36d3acef4b4ef033f4bea0016da1">
<title>Perspect — Join</title><link rel="stylesheet" href="kit.css">
<style>.wrap{min-height:100vh;display:grid;place-items:center;padding:16px}.box{width:100%;max-width:420px}.brand{font-size:22px;font-weight:800;letter-spacing:-.02em}.brand b{background:linear-gradient(135deg,var(--fire),var(--rose));-webkit-background-clip:text;color:transparent}</style>
</head><body>
<div class="wrap"><div class="box">
  <div class="brand"><b>Perspect</b></div>
  <p class="muted">Join your group. Your key is made on this device and never leaves it.</p>
  <div class="card"><div class="bd">
    <label class="lbl" for="code">Invite code</label><input class="in" id="code" autocomplete="off" placeholder="from the person who invited you">
    <label class="lbl" for="name">Your name</label><input class="in" id="name" maxlength="40" placeholder="what the group calls you">
    <div class="row" style="margin-top:14px"><button class="btn p" id="go">Join</button><span id="msg" class="muted"></span></div>
  </div></div>
  <p class="faint" style="font-size:12px;margin-top:12px">Already a member on this device? <a href="chat.html">Open the group</a></p>
</div></div>
<script src="/group/client.js"></script><script src="kit.js"></script>
<script>
const q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
if (q.get('invite')) $('code').value = q.get('invite');
if (q.get('removed')) $('msg').innerHTML = '<span class="err">This device was removed from the group.</span>';
const WHY = { invite_invalid: 'That invite is unknown, used up or expired.', contract_mismatch: 'This page is out of date; reload.', removed: 'This device was removed from the group.' };
$('go').onclick = async () => {
  if (!$('code').value.trim()) { $('msg').innerHTML = '<span class="err">Enter your invite code.</span>'; return; }
  sessionStorage.setItem('perspect.invite', $('code').value.trim()); sessionStorage.setItem('perspect.name', $('name').value.trim() || 'New member');
  $('msg').textContent = 'Joining…';
  PK.start('join', (ctx, e) => { if (e) { $('msg').innerHTML = '<span class="err">' + PK.esc(WHY[e.code] || e.message) + '</span>'; sessionStorage.removeItem('perspect.invite'); return; } location.href = 'chat.html'; });
};
</script></body></html>
